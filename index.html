<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My GitHub Pages Site</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #333;
      text-align: center;
    }

    header {
      background: #24292e;
      color: white;
      padding: 20px;
    }

    main {
      padding: 40px;
    }

    .card {
      background: white;
      padding: 20px;
      margin: 20px auto;
      max-width: 500px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      background: #ddd;
      font-size: 14px;
    }

    a {
      color: #0366d6;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>Welcome to My Website</h1>
  <p>Hosted with GitHub Pages</p>
</header>

<main>
  <div class="card">
    <h2>Hello 👋</h2>
    <p>This is my first website hosted on GitHub Pages.</p>
  </div>

  <div class="card">
    <h2>My Projects</h2>
    <p>Check out my work on 
      <a href="https://github.com/">GitHub</a>.
    </p>
  </div>
</main>

<footer>
  <p>© 2026 My Website</p>
</footer>

</body>
</html>
